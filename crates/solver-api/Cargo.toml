[package]
name = "solver-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "给桌面应用调用的求解接口：翻前查表、翻后两人底池后台求解、进度和每个动作的 EV"

[dependencies]
holdem = { path = "../holdem" }
preflop = { path = "../preflop" }
postflop = { path = "../postflop" }
postflop-solver = { path = "../postflop-solver" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
